<!doctype html>
<html lang="en" class="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mazen</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Cairo & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Cairo', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* Material 3 CSS Variables matching React's index.css exactly */
    :root {
      --m3-primary: #006495;
      --m3-on-primary: #ffffff;
      --m3-primary-container: #cbe6ff;
      --m3-on-primary-container: #001e30;
      
      --m3-secondary: #50606e;
      --m3-on-secondary: #ffffff;
      --m3-secondary-container: #d3e5f5;
      --m3-on-secondary-container: #0c1d29;

      --m3-tertiary: #655675;
      --m3-on-tertiary: #ffffff;
      --m3-tertiary-container: #ebdcff;
      --m3-on-tertiary-container: #20132f;

      --m3-surface: #fcfcff;
      --m3-on-surface: #1a1c1e;
      --m3-surface-variant: #e0e2ec;
      --m3-on-surface-variant: #43474e;
      --m3-outline: #73777f;
      
      --m3-surface-container: #f0f3f8;
      --m3-surface-container-high: #e9ecf2;
    }

    :root.dark {
      --m3-primary: #90cdff;
      --m3-on-primary: #003350;
      --m3-primary-container: #004b71;
      --m3-on-primary-container: #cbe6ff;
      
      --m3-secondary: #b8c9d9;
      --m3-on-secondary: #22323f;
      --m3-secondary-container: #394856;
      --m3-on-secondary-container: #d3e5f5;

      --m3-tertiary: #cfbdfe;
      --m3-on-tertiary: #362945;
      --m3-tertiary-container: #4d3f5c;
      --m3-on-tertiary-container: #ebdcff;

      --m3-surface: #121418;
      --m3-on-surface: #e2e2e5;
      --m3-surface-variant: #43474e;
      --m3-on-surface-variant: #c3c7d0;
      --m3-outline: #8d9199;
      
      --m3-surface-container: #1d2024;
      --m3-surface-container-high: #282a2f;
    }

    /* Core Styles and Smooth transitions */
    body {
      transition: background-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      background-color: var(--m3-surface);
      color: var(--m3-on-surface);
    }

    /* Liquid Glass Backdrop Reflection Layer */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 
        0 10px 30px -10px rgba(0, 0, 0, 0.04),
        0 1px 3px rgba(0, 0, 0, 0.02),
        inset 0 1px 2px rgba(255, 255, 255, 0.8),
        inset 0 -1px 1px rgba(0, 0, 0, 0.02);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom right,
        rgba(255, 255, 255, 0.3) 0%,
        rgba(255, 255, 255, 0.05) 40%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .dark .liquid-glass {
      background: rgba(18, 22, 28, 0.65);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.45),
                  inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* Fluid sliding navigation indicator transitions */
    #nav-indicator {
      transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }

    /* Floating Expressive Material Blobs (Hardware Accelerated) */
    @keyframes morph-blob-1 {
      0%, 100% {
        transform: scale(1) rotate(0deg) translate(0px, 0px);
      }
      25% {
        transform: scale(1.08) rotate(90deg) translate(25px, -15px);
      }
      50% {
        transform: scale(0.95) rotate(180deg) translate(-15px, 25px);
      }
      75% {
        transform: scale(1.04) rotate(270deg) translate(8px, 8px);
      }
    }

    @keyframes morph-blob-2 {
      0%, 100% {
        transform: scale(1) rotate(0deg) translate(0px, 0px);
      }
      33% {
        transform: scale(0.95) rotate(-120deg) translate(-30px, 15px);
      }
      66% {
        transform: scale(1.05) rotate(-240deg) translate(15px, -30px);
      }
    }

    @keyframes morph-blob-3 {
      0%, 100% {
        transform: scale(1) rotate(0deg) translate(0px, 0px);
      }
      50% {
        transform: scale(1.1) rotate(180deg) translate(20px, 20px);
      }
    }

    .blob-1 {
      animation: morph-blob-1 25s infinite ease-in-out;
    }
    .blob-2 {
      animation: morph-blob-2 28s infinite ease-in-out;
    }
    .blob-3 {
      animation: morph-blob-3 32s infinite ease-in-out;
    }

    /* Spring-like logo bounce */
    @keyframes logo-spring {
      0% {
        transform: translateY(0) scale(1) rotate(0deg);
      }
      15% {
        transform: translateY(-35px) scale(1.25) rotate(15deg);
      }
      35% {
        transform: translateY(10px) scale(0.9) rotate(-10deg);
      }
      55% {
        transform: translateY(-10px) scale(1.05) rotate(5deg);
      }
      75% {
        transform: translateY(5px) scale(0.98) rotate(-2deg);
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
      }
    }
    .logo-spring-active {
      animation: logo-spring 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    /* Custom hover styles for flat skill chips */
    .skill-godot:hover { color: #478CBF !important; background-color: rgba(71, 140, 191, 0.08) !important; }
    .skill-android:hover { color: #3DDC84 !important; background-color: rgba(61, 220, 132, 0.08) !important; }
    .skill-html:hover { color: #E34F26 !important; background-color: rgba(227, 79, 38, 0.08) !important; }
    .skill-css:hover { color: #1572B6 !important; background-color: rgba(21, 114, 182, 0.08) !important; }
    .skill-js:hover { color: #F7DF1E !important; background-color: rgba(247, 223, 30, 0.08) !important; }
    .skill-kotlin:hover { color: #7F52FF !important; background-color: rgba(127, 82, 255, 0.08) !important; }
    .skill-python:hover { color: #3776AB !important; background-color: rgba(55, 118, 171, 0.08) !important; }

    /* Material 3 Expressive Custom Spring Curves & Shapes */
    .m3-spring {
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .m3-spring-fast {
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Tactile Press State */
    .m3-press-active:active {
      transform: scale(0.95);
    }

    /* Scroll Reveal Animations */
    .reveal-item {
      opacity: 0;
      will-change: opacity, transform;
      transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .reveal-up {
      transform: translateY(45px);
    }

    .reveal-down {
      transform: translateY(-45px);
    }

    .reveal-scale {
      transform: scale(0.93);
    }

    .reveal-left {
      transform: translateX(-45px);
    }

    .reveal-right {
      transform: translateX(45px);
    }

    /* Revealed States */
    .reveal-item.revealed {
      opacity: 1;
      transform: translateY(0) translateX(0) scale(1);
    }
  </style>
</head>
<body class="min-h-screen font-sans transition-colors duration-500 overflow-x-hidden select-none bg-[var(--m3-surface)] text-[var(--m3-on-surface)]">

  <!-- Background Morphing Blobs and Decorative Geometries -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <!-- Blob 1 -->
    <div class="absolute -top-[10%] -left-[10%] w-[60vw] h-[60vw] bg-indigo-500/25 dark:bg-indigo-600/20 rounded-full blur-[130px] blob-1"></div>
    
    <!-- Blob 2 -->
    <div class="absolute top-[30%] -right-[10%] w-[55vw] h-[55vw] bg-purple-500/20 dark:bg-purple-600/15 rounded-full blur-[130px] blob-2"></div>
    
    <!-- Blob 3 -->
    <div class="absolute bottom-[-10%] left-[5%] w-[55vw] h-[55vw] bg-emerald-500/20 dark:bg-emerald-600/15 rounded-full blur-[140px] blob-3"></div>
    
    <!-- Floating Geometry Lines -->
    <div class="absolute inset-0 opacity-15 dark:opacity-8">
      <div class="absolute top-[20%] left-[15%] w-16 h-16 rounded-full border border-blue-500/30 animate-[pulse_8s_infinite]"></div>
      <div class="absolute top-[60%] right-[20%] w-24 h-24 rounded-[32px] border border-purple-500/30 animate-[spin_20s_infinite_linear]"></div>
      <div class="absolute bottom-[20%] left-[25%] w-12 h-24 rounded-full border border-pink-500/30"></div>
    </div>
  </div>

      <!-- Logo Brand -->
      <a href="#home" class="flex items-center gap-1.5 sm:gap-2.5 cursor-pointer group transition-transform duration-300 hover:scale-105 shrink-0">
        <span class="text-base sm:text-xl font-black tracking-tight text-[var(--m3-on-surface)]" data-t="brandName">MAZEN</span>
      </a>

      <!-- Navigation links (Visible on md and larger screens) -->
      <div class="hidden md:flex items-center gap-2.5 sm:gap-6 md:gap-8 relative select-none">
        <a href="#home" data-section="home" class="nav-link px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-full text-[11px] sm:text-sm font-bold transition-all duration-300 relative text-blue-600 dark:text-blue-300" data-t="navHome">Home</a>
        <a href="#skills" data-section="skills" class="nav-link px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-full text-[11px] sm:text-sm font-bold transition-all duration-300 relative text-[var(--m3-on-surface-variant)]" data-t="navSkills">Skills</a>
        <a href="#projects" data-section="projects" class="nav-link px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-full text-[11px] sm:text-sm font-bold transition-all duration-300 relative text-[var(--m3-on-surface-variant)]" data-t="navProjects">Projects</a>
        <a href="#contact" data-section="contact" class="nav-link px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-full text-[11px] sm:text-sm font-bold transition-all duration-300 relative text-[var(--m3-on-surface-variant)]" data-t="navContact">Contact</a>
        
        <!-- Sliding active capsule background (Material 3 Expressive Style) -->
        <div id="nav-indicator" class="absolute inset-y-1 rounded-full bg-blue-500/10 dark:bg-blue-400/15 -z-10" style="left: 0px; width: 0px;"></div>
      </div>

      <!-- Settings Controls Toggles -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
        
        <!-- Language button (Always visible) -->
        <button id="lang-btn" class="hidden md:flex px-2.5 sm:px-4 py-1.5 sm:py-2.5 rounded-full text-[10px] sm:text-xs font-black tracking-wider bg-neutral-100 hover:bg-neutral-200 dark:bg-neutral-800 dark:hover:bg-neutral-700 border border-neutral-200/60 dark:border-neutral-700/60 shadow-sm hover:scale-105 active:scale-95 transition-all text-neutral-900 dark:text-neutral-100 items-center justify-center cursor-pointer" aria-label="Toggle language">
          <span id="lang-toggle-text">العربية</span>
        </button>

        <!-- Theme button (Always visible) -->
        <button id="theme-btn" class="hidden md:flex p-2 sm:p-3 rounded-full bg-neutral-100 hover:bg-neutral-200 dark:bg-neutral-800 dark:hover:bg-neutral-700 border border-neutral-200/60 dark:border-neutral-700/60 shadow-sm hover:scale-105 active:scale-95 transition-all text-neutral-900 dark:text-neutral-100 items-center justify-center cursor-pointer" aria-label="Toggle theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-amber-500 dark:hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-blue-400 hidden dark:block"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>

        <!-- Mobile Menu Trigger Button (Visible on mobile only) -->
        <button id="mobile-menu-btn" class="flex md:hidden p-2 sm:p-3 rounded-full bg-neutral-100 hover:bg-neutral-200 dark:bg-neutral-800 dark:hover:bg-neutral-700 border border-neutral-200/60 dark:border-neutral-700/60 shadow-sm hover:scale-105 active:scale-95 transition-all text-neutral-900 dark:text-neutral-100 items-center justify-center cursor-pointer" aria-label="Open menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 sm:w-4 sm:h-4"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Drawer Backdrop & Container -->

    <!-- Backdrop overlay -->
    <div id="drawer-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm pointer-events-none transition-opacity duration-300 opacity-0"></div>

      <div>
        <div class="flex items-center justify-between mb-8">
          <span class="text-xl font-black text-[var(--m3-on-surface)]" data-t="brandName">Mazen</span>

          <a href="#skills" class="mobile-nav-link py-3 px-4 rounded-full text-base font-bold text-[var(--m3-on-surface-variant)] hover:bg-black/5 dark:hover:bg-white/5 transition-colors" data-t="navSkills">Skills</a>
          <a href="#projects" class="mobile-nav-link py-3 px-4 rounded-full text-base font-bold text-[var(--m3-on-surface-variant)] hover:bg-black/5 dark:hover:bg-white/5 transition-colors" data-t="navProjects">Projects</a>
          <a href="#contact" class="mobile-nav-link py-3 px-4 rounded-full text-base font-bold text-[var(--m3-on-surface-variant)] hover:bg-black/5 dark:hover:bg-white/5 transition-colors" data-t="navContact">Contact</a>
        </div>
      </div>
      
      <!-- Drawer Bottom controls -->
      <div class="flex flex-col gap-4">
        <div class="h-[1px] bg-black/5 dark:bg-white/10 w-full"></div>
        
        <div class="grid grid-cols-2 gap-3">
          <button id="drawer-lang-btn" class="py-3.5 rounded-full text-xs font-black tracking-wider bg-[var(--m3-surface-container-high)] hover:opacity-90 transition-all text-[var(--m3-on-surface)] flex items-center justify-center">
            <span id="drawer-lang-text">العربية</span>
          </button>

            <i data-lucide="moon" class="w-4 h-4 text-blue-400 hidden dark:block"></i>
          </button>

      </div>
    </div>

      <div class="text-center max-w-2xl mx-auto mb-12">
        <h2 class="text-3xl md:text-4xl font-extrabold text-[var(--m3-on-surface)] reveal-item reveal-up" data-t="projectsTitle">
          Latest Works

      <!-- Projects Flat Card Layout (Flat, No Shadows) -->

    <div class="w-full overflow-hidden flex items-center justify-center my-6">
      <canvas id="canvas-wave-3" class="w-full block" style="height: 45px;"></canvas>
    </div>

    <!-- Contact Me Form Section -->

    // Intersection Observer for Scroll Reveal Animations
    let revealObserver;

    function initRevealObserver() {
      if (!window.IntersectionObserver) {
        // Fallback for older browsers
        document.querySelectorAll('.reveal-item').forEach(el => el.classList.add('revealed'));
        return;
      }

      const revealCallback = (entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
            observer.unobserve(entry.target);
          }
        });
      };

      revealObserver = new IntersectionObserver(revealCallback, {
        root: null,
        threshold: 0.03, // Trigger when 3% of the element is visible
        rootMargin: '0px 0px -30px 0px' // Slightly offset trigger point
      });

      refreshRevealElements();
    }

    function refreshRevealElements() {
      if (!revealObserver) return;
      document.querySelectorAll('.reveal-item:not(.revealed)').forEach(el => {
        revealObserver.observe(el);
      });
    }

            </div>
            <div class="text-white/90">
              <i data-lucide="${project.type === 'game' ? 'gamepad-2' : 'smartphone'}" class="w-7 h-7 animate-pulse"></i>
            </div>
            ${project.comingSoon ? `
            <div class="absolute top-3 ltr:right-3 rtl:left-3 px-4 py-1.5 rounded-full text-base sm:text-lg font-black tracking-widest uppercase bg-amber-400 text-amber-950 select-none shadow-lg animate-pulse z-10">
              SOON
            </div>` : ''}
          </div>

          <!-- Body -->
          <div class="p-6 flex-1 flex flex-col justify-between">
            <p class="text-sm text-[var(--m3-on-surface-variant)] leading-relaxed mb-6 font-medium">
              ${pDesc}
            </p>

            <div class="space-y-4">
              ${project.comingSoon ? `
              <!-- Disabled coming-soon button -->
              <div
                aria-disabled="true"
                class="w-full py-3 px-4 rounded-full bg-[var(--m3-surface-container-high)] flex items-center justify-center gap-2 text-sm font-bold text-[var(--m3-on-surface-variant)] opacity-70 cursor-not-allowed select-none shadow-none"
              >
                <i data-lucide="lock" class="w-5 h-5"></i>
                <span>${t.projectComingSoon}</span>
              </div>` : `
              <!-- View code link -->
              <a
                href="${project.githubUrl}"
                target="_blank"
                rel="noopener noreferrer"
                class="w-full py-3 px-4 rounded-full bg-[var(--m3-secondary-container)] flex items-center justify-center gap-2 text-sm font-bold text-[var(--m3-on-secondary-container)] hover:opacity-90 transition-all group shadow-none"
              >
                <i data-lucide="github" class="w-5 h-5 text-indigo-400"></i>
                <span>${t.projectViewCode}</span>
              </a>`}
            </div>
          </div>
        `;
        container.appendChild(article);
      });
      if (typeof refreshRevealElements === 'function') refreshRevealElements();
    }

    // Dynamic Mobile Drawer actions with keyboard focus trapping & escape handlers
    function openDrawer() {
      const drawer = document.getElementById('mobile-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      const panel = document.getElementById('drawer-panel');
      const toggleBtn = document.getElementById('mobile-menu-btn');
      const closeBtn = document.getElementById('close-drawer-btn');

      if (!drawer || !backdrop || !panel) return;

      drawer.classList.remove('pointer-events-none', 'opacity-0');
      drawer.classList.add('opacity-100');
      drawer.setAttribute('aria-hidden', 'false');
      backdrop.classList.add('opacity-100');
      backdrop.classList.remove('opacity-0');
      panel.classList.remove('translate-x-full', '-translate-x-full');

      if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
      
      // Shift focus inside drawer safely for screen readers & keyboard users
      setTimeout(() => {
        if (closeBtn) closeBtn.focus();
      }, 100);

      document.addEventListener('keydown', handleEscapeKey);
      document.addEventListener('keydown', handleFocusTrap);
    }

    function closeDrawer() {
      const drawer = document.getElementById('mobile-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      const panel = document.getElementById('drawer-panel');
      const toggleBtn = document.getElementById('mobile-menu-btn');

      if (!drawer || !backdrop || !panel) return;

      drawer.classList.add('pointer-events-none', 'opacity-0');
      drawer.classList.remove('opacity-100');
      drawer.setAttribute('aria-hidden', 'true');
      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0');
      
      // Slide back to corresponding direction
      if (state.lang === 'ar') {
        panel.classList.add('-translate-x-full');
      } else {
        panel.classList.add('translate-x-full');
      }

      if (toggleBtn) {
        toggleBtn.setAttribute('aria-expanded', 'false');
        toggleBtn.focus();
      }

      document.removeEventListener('keydown', handleEscapeKey);
      document.removeEventListener('keydown', handleFocusTrap);
    }

    function handleEscapeKey(e) {
      if (e.key === 'Escape') {
        closeDrawer();
      }
    }

    function handleFocusTrap(e) {
      const panel = document.getElementById('drawer-panel');
      if (!panel) return;
      
      const focusableEls = panel.querySelectorAll('button, [href], input, select, textarea, [tabindex="0"]');
      if (focusableEls.length === 0) return;
      
      const firstFocusableEl = focusableEls[0];
      const lastFocusableEl = focusableEls[focusableEls.length - 1];

      if (e.key === 'Tab') {
        if (e.shiftKey) { /* shift + tab */
          if (document.activeElement === firstFocusableEl) {
            lastFocusableEl.focus();
            e.preventDefault();
          }
        } else { /* tab */
          if (document.activeElement === lastFocusableEl) {
            firstFocusableEl.focus();
            e.preventDefault();
          }
        }
      }
    }

    function updateDrawerDirection() {
      const panel = document.getElementById('drawer-panel');
      if (!panel) return;
      if (state.lang === 'ar') {
        panel.classList.add('left-0', '-translate-x-full');
        panel.classList.remove('right-0', 'translate-x-full');
      } else {
        panel.classList.add('right-0', 'translate-x-full');
        panel.classList.remove('left-0', '-translate-x-full');
      }
    }

    // Auto close drawer when clicking anchors
    document.querySelectorAll('.mobile-nav-link').forEach(link => {
      link.addEventListener('click', closeDrawer);
    });

    // Wavy Canvas Draw Engine (replicates Android Custom View Sine sinus wave)
    function initWavyCanvas(canvasId, color, speed) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let offset = 0;
      let animId;
      let width = 0;
      let height = 0;

      const resizeCanvas = () => {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        width = rect.width;
        height = rect.height;
      };

      resizeCanvas();
      const observer = new ResizeObserver(() => resizeCanvas());
      observer.observe(canvas);

      const draw = () => {
        if (width <= 0 || height <= 0) {
          animId = requestAnimationFrame(draw);
          return;
        }
        ctx.clearRect(0, 0, width, height);
        
        const centerY = height / 2;
        const amplitude = height / 3;
        const frequency = 0.015;

        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.moveTo(0, centerY);
        for (let x = 0; x <= width; x += 4) {
          const y = centerY + amplitude * Math.sin(x * frequency + offset);
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        offset += speed;
        animId = requestAnimationFrame(draw);
      };

      draw();

      return {
        updateColor: (newColor) => {
          color = newColor;
        },
        destroy: () => {
          cancelAnimationFrame(animId);
          observer.disconnect();
        }
      };
    }

    function initAllWaves() {
      initializedWaves.forEach(w => w.destroy());
      initializedWaves = [];

      const pColor = state.isDark ? '#90cdff' : '#006495';
      const sColor = state.isDark ? '#cfbdfe' : '#655675';

      initializedWaves.push(initWavyCanvas('canvas-wave-1', pColor, 0.04));
      initializedWaves.push(initWavyCanvas('canvas-wave-2', sColor, 0.06));
      initializedWaves.push(initWavyCanvas('canvas-wave-3', pColor, 0.05));
    }

    // Scroll Tracking Navigation Highlight sliding indicator bar
    const sections = ['home', 'skills', 'projects', 'contact'];

    function updateActiveSectionOnScroll() {
      const scrollPos = window.scrollY;
      const viewportHeight = window.innerHeight;
      const middleOfViewport = scrollPos + (viewportHeight / 3);

      let activeSec = 'home';

      for (const secId of sections) {
        const el = document.getElementById(secId);
        if (el) {
          const top = el.offsetTop;
          if (middleOfViewport >= top) {
            activeSec = secId;
          }
        }
      }

      if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 120) {
        activeSec = 'contact';
      }

      if (activeSec !== state.activeTab) {
        state.activeTab = activeSec;
        updateNavIndicator();
      }
    }

    let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (!scrollTicking) {
        window.requestAnimationFrame(() => {
          const nav = document.getElementById('navbar');
          const navInner = document.getElementById('navbar-inner');
          if (nav && navInner) {
            const scrolled = window.scrollY > 20;
            if (scrolled) {
              nav.classList.add('py-2');
              nav.classList.remove('py-4');
              navInner.classList.add('py-2.5', 'shadow-xl');
              navInner.classList.remove('py-4');
            } else {
              nav.classList.add('py-4');
              nav.classList.remove('py-2');
              navInner.classList.add('py-4');
              navInner.classList.remove('py-2.5', 'shadow-xl');
            }
          }
          updateActiveSectionOnScroll();
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    }, { passive: true });

    // Sliding indicator layout position matching active section
    function updateNavIndicator() {
      const activeLink = document.querySelector(`.nav-link[data-section="${state.activeTab}"]`);
      const indicator = document.getElementById('nav-indicator');

      if (activeLink && indicator) {
        indicator.style.opacity = '1';
        
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link === activeLink) {
             link.classList.add('text-blue-600', 'dark:text-blue-300');
             link.classList.remove('text-[var(--m3-on-surface-variant)]');
           } else {
             link.classList.remove('text-blue-600', 'dark:text-blue-300');
             link.classList.add('text-[var(--m3-on-surface-variant)]');
           }
         });
 
         indicator.style.left = `${activeLink.offsetLeft}px`;
         indicator.style.width = `${activeLink.offsetWidth}px`;
       } else if (indicator) {
         indicator.style.opacity = '0';
       }
     }

    // Copy email address to clipboard with Toast feedback + temporary button state
    function handleCopyEmail() {
      const emailEl = document.getElementById('contact-email-text');
      const btnText = document.getElementById('copy-email-text');
      const t = translations[state.lang];
      if (!emailEl) return;

      const email = emailEl.textContent.trim();

      const showCopied = () => {
        showToast(t.contactCopySuccess, 'success');
        if (btnText) {
          btnText.textContent = t.contactCopiedBtn;
          setTimeout(() => { btnText.textContent = translations[state.lang].contactCopyBtn; }, 2000);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(showCopied).catch(() => {
          fallbackCopy(email, showCopied);
        });
      } else {
        fallbackCopy(email, showCopied);
      }
    }

    // Fallback copy method for browsers without Clipboard API support
    function fallbackCopy(text, onSuccess) {
      const textarea = document.createElement('textarea');
      text = text.trim();
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        onSuccess();
      } catch (err) {
        console.warn('Fallback copy failed:', err);
      }
      document.body.removeChild(textarea);
    }

    // Bilingual Floating Notification Toast Builder
    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      const colorClass = type === 'success' ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white';
      const icon = type === 'success' ? 'check-circle' : 'alert-circle';

      toast.className = `flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-4 opacity-0 ${colorClass}`;
      toast.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i>
        <span class="text-sm font-bold">${message}</span>
      `;

      container.appendChild(toast);
      try {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      } catch (err) {
        console.warn('Lucide icons creation error bypassed in showToast:', err);
      }

      setTimeout(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      }, 10);

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => toast.remove(), 350);
      }, 5000);
    }

    function safeSetLocalStorage(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (err) {
        console.warn(`localStorage write failed for ${key}:`, err);
      }
    }
  </script>
